services:
  - type: web
    name: your-bot-name
    runtime: node
    branch: main
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # ═══════════════════════════════════════════════════════════════════
      # Bot identity & admin access
      # ═══════════════════════════════════════════════════════════════════
      - key: TWITCH_USERNAME
        value: "your-bot-username"
      - key: ADMIN_USERNAMES
        value: "your-streamer-username"
      - key: TWITCH_CLIENT_ID
        value: "your-twitch-client-id"
      - key: TWITCH_CLIENT_SECRET
        value: "your-twitch-client-secret"

      # ═══════════════════════════════════════════════════════════════════
      # API keys & persistence
      # ═══════════════════════════════════════════════════════════════════
      # Vertex AI users may manually use VERTEX_API_KEY instead; see the README FAQ.
      - key: GEMINI_API_KEY
        value: "your-gemini-api-key(s)"    # Comma-separated keys rotate automatically
      - key: UPSTASH_REDIS_URL
        value: "your-upstash-redis-url"
      - key: TAVILY_API_KEY
        value: "your-tavily-api-key"       # Optional: enables live web search
      - key: POLLINATIONS_API_KEY
        value: "your-pollinations-api-key" # Optional: enables !image !video !tts !song
      - key: YOUTUBE_API_KEY
        value: "your-youtube-api-key"      # Optional: adds YouTube titles/descriptions to prompts
